name: Pull request validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build DataAccessServer
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      PROJECT: DataAccessServer/DataAccessServer.csproj

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore DataAccessServer
        run: dotnet restore "${{ env.PROJECT }}"

      - name: Build DataAccessServer
        run: >
          dotnet build "${{ env.PROJECT }}"
          --configuration Release
          --no-restore

      - name: Run tests when present
        shell: pwsh
        run: |
          $testProjects = @(
            Get-ChildItem -Path . -Recurse -File -Filter *.csproj |
              Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' } |
              Where-Object {
                $projectContents = Get-Content -LiteralPath $_.FullName -Raw
                $projectContents -match '<IsTestProject>\s*true\s*</IsTestProject>' -or
                  $projectContents -match '<PackageReference\s+[^>]*Include="Microsoft\.NET\.Test\.Sdk"'
              }
          )

          if ($testProjects.Count -eq 0) {
            Write-Host 'No test projects found.'
            exit 0
          }

          foreach ($testProject in $testProjects) {
            $relativePath = Resolve-Path -LiteralPath $testProject.FullName -Relative
            Write-Host "Testing $relativePath"

            dotnet test $testProject.FullName `
              --configuration Release `
              --logger "console;verbosity=normal"

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }